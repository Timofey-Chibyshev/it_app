version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edu_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: sh -c "python -m init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=edu_platform_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - UPLOAD_DIR=/uploads/assignments
    volumes:
      - uploads_volume:/uploads
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - uploads_volume:/usr/share/nginx/uploads:ro
    depends_on:
      - app

volumes:
  postgres_data:
  uploads_volume: