{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-form fade-in">
        <h2 class="d-flex align-items-center justify-content-center">
            <i class="bi bi-door-open fs-1 me-3"></i>
            <span>Вход в систему</span>
        </h2>

        {% if error %}
        <div class="alert error mb-4">
            <i class="bi bi-exclamation-circle fs-5 me-2"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/auth/login-form">
            <!-- Поле Email -->
            <div class="form-group">
                <label class="form-label">Email</label>
                <div class="input-field">
                    <i class="bi bi-envelope-fill input-icon"></i>
                    <input 
                        type="email" 
                        name="username" 
                        class="form-control"
                        required 
                        placeholder="example@edu.ru"
                        autocomplete="username"
                        value="{{ form_data.get('username', '') }}"
                    >
                </div>
            </div>

            <!-- Поле Пароль -->
            <div class="form-group password-field"> <!-- Добавляем специальный класс -->
                <label class="form-label">Пароль</label>
                <div class="input-field">
                    <i class="bi bi-lock-fill input-icon"></i>
                    <input 
                        type="password" 
                        name="password" 
                        class="form-control password-input"
                        required 
                        placeholder="••••••••"
                    >
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePassword(this)"></i>
                </div>
            </div>
            
            <!-- Кнопка входа -->
            <button type="submit" class="btn btn-primary btn-block mt-4 py-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                <span>Войти в систему</span>
            </button>

            <!-- Ссылка на регистрацию -->
            <div class="auth-links mt-4 text-center">
                <span class="text-muted">Нет аккаунта?</span>
                <a href="/auth/register" class="text-decoration-none fw-bold ms-2">
                    Создать аккаунт
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
