{% extends "base.html" %}

{% block title %}Поиск{% endblock %}

{% block content %}
<div class="container">
    <div class="search-container mb-5">
        <h1 class="mb-4">Поиск</h1>
        <div class="input-group">
            <input type="text" 
                   id="searchInput" 
                   class="form-control form-control-lg" 
                   placeholder="Введите название предмета или имя преподавателя..."
                   autocomplete="off">
            <button class="btn btn-primary" type="button" disabled>
                <i class="bi bi-search"></i>
            </button>
        </div>
    </div>

    <div id="searchResults" class="search-results">
        <!-- Результаты будут вставлены сюда -->
    </div>
</div>

<style>
    .search-results {
        max-width: 800px;
        margin: 0 auto;
    }
    .result-card {
        transition: transform 0.2s;
    }
    .result-card:hover {
        transform: translateY(-2px);
    }
</style>

<script>
document.getElementById('searchInput').addEventListener('input', async function(e) {
    const query = e.target.value.trim();
    const resultsContainer = document.getElementById('searchResults');
    
    if (query.length < 3) {
        resultsContainer.innerHTML = '';
        return;
    }

    try {
        const response = await fetch(`/search/results?query=${encodeURIComponent(query)}`);
        const data = await response.json();
        
        let html = '';
        
        if (data.results.length > 0) {
            html += `
            <div class="row g-3">
                <div class="col-12">
                    <h5 class="text-muted mb-3">Найденные предметы</h5>
                    <div class="row g-3">
                        ${data.results.map(item => `
                        <div class="col-md-6">
                            <a href="${item.url}" class="card result-card text-decoration-none">
                                <div class="card-body">
                                    <h6 class="card-title">${item.name}</h6>
                                    <div class="text-muted small">
                                        ${item.teacher} • ${item.type === 'lecture' ? 'Лекция' : 'Практика'}
                                    </div>
                                </div>
                            </a>
                        </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        } else {
            html = `<div class="text-center text-muted py-4">Ничего не найдено</div>`;
        }

        resultsContainer.innerHTML = html;

    } catch (error) {
        console.error('Ошибка поиска:', error);
        resultsContainer.innerHTML = `<div class="alert alert-danger">Ошибка при выполнении поиска</div>`;
    }
});
</script>
{% endblock %}
