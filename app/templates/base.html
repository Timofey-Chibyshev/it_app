<!-- Обновленный base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - UniPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% if current_user %}/home{% else %}/{% endif %}">
                <i class="bi bi-mortarboard-fill"></i>
                UniPlatform
            </a>
            
            <div class="d-flex align-items-center">
                {% if current_user %}
                    <span class="text-white me-3 d-none d-md-block">{{ current_user.first_name }}</span>
                    <a href="/auth/logout" class="btn btn-outline-light">
                        Выйти <i class="bi bi-box-arrow-right ms-1"></i>
                    </a>
                {% else %}
                    <a href="/auth/login" class="btn btn-outline-light">
                        Вход
                    </a>
                    <a href="/auth/register" class="btn btn-primary ms-2">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <div class="mb-3 mb-md-0">
                        <a href="#" class="text-white text-decoration-none me-3">О платформе</a>
                        <a href="#" class="text-white text-decoration-none me-3">Контакты</a>
                        <a href="#" class="text-white text-decoration-none">Поддержка</a>
                    </div>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <div class="text-muted small">
                        © 2024 UniPlatform. Все права защищены.
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        function togglePassword(container) {
            const icon = container.querySelector('i');
            const input = container.parentElement.querySelector('.password-input');
            const isPassword = input.type === 'password';
            
            input.type = isPassword ? 'text' : 'password';
            icon.classList.toggle('bi-eye-slash', !isPassword);
            icon.classList.toggle('bi-eye', isPassword);
            icon.style.color = isPassword 
                ? 'var(--secondary-color)' 
                : 'var(--gray-400)';
        }
    </script>
</body>
</html>
